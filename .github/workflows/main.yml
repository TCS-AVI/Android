name: Build TCS Home APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: TCSHome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'
      - name: Check project files
        run: |
          ls -la
          ls app/src/main
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log
      - name: Show last lines of the log
        if: failure()
        run: |
          { echo '## Build log (end)'; echo '```'; tail -60 build.log 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: TCSHome-APK
          path: TCSHome/app/build/outputs/apk/debug/app-debug.apk
